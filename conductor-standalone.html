<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Conductor</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body,#root{width:100%;height:100%;overflow:hidden;background:#080810;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{overscroll-behavior:none;touch-action:manipulation}

/* Splash */
.splash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:28px;padding:32px;text-align:center}
.splash-icon{font-size:52px;margin-bottom:4px;filter:drop-shadow(0 0 30px rgba(124,58,237,0.6))}
.splash-title{font-size:30px;font-weight:900;letter-spacing:0.06em;background:linear-gradient(135deg,#EDE9FE,#A78BFA,#7C3AED);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.splash-subtitle{font-size:11px;color:rgba(255,255,255,0.25);letter-spacing:0.25em}
.splash-desc{max-width:300px;line-height:1.9;color:rgba(255,255,255,0.4);font-size:14px}
.splash-btn{background:linear-gradient(135deg,#7C3AED,#5B21B6);border:1px solid rgba(167,139,250,0.3);border-radius:20px;padding:20px 60px;color:#fff;font-size:16px;font-weight:800;cursor:pointer;letter-spacing:0.08em;box-shadow:0 0 60px rgba(124,58,237,0.4);transition:transform 0.15s,box-shadow 0.15s}
.splash-btn:hover{transform:translateY(-2px);box-shadow:0 0 80px rgba(124,58,237,0.6)}
.splash-hint{font-size:11px;color:rgba(255,255,255,0.15)}

/* App */
.app{min-height:100vh;background:#080810;color:#fff;display:flex;flex-direction:column}

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid rgba(255,255,255,0.05);background:rgba(0,0,0,0.6);backdrop-filter:blur(16px);position:sticky;top:0;z-index:10;flex-wrap:wrap;gap:10px}
.header-brand{display:flex;align-items:center;gap:10px}
.header-icon{font-size:20px;filter:drop-shadow(0 0 8px rgba(124,58,237,0.8))}
.header-title{font-weight:800;font-size:14px;letter-spacing:0.08em;background:linear-gradient(90deg,#EDE9FE,#A78BFA);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-subtitle{font-size:8px;color:rgba(255,255,255,0.2);letter-spacing:0.18em;margin-top:1px}
.header-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.header-btn{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:6px;padding:4px 12px;color:rgba(255,255,255,0.35);font-size:10px;cursor:pointer;letter-spacing:0.06em;transition:all 0.15s}
.header-btn:hover{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.6)}
.header-btn.active{background:rgba(124,58,237,0.2);border-color:rgba(124,58,237,0.4);color:#A78BFA}
.volume-control{display:flex;align-items:center;gap:6px}
.vol-label{font-size:8px;color:rgba(255,255,255,0.25);letter-spacing:0.1em}
.vol-slider{width:60px;accent-color:#7C3AED}
.vol-value{font-size:10px;color:#A78BFA;font-family:monospace;min-width:36px}
.status-badge{display:flex;align-items:center;gap:5px;font-size:10px;color:rgba(255,255,255,0.35)}
.status-badge.live{color:#34D399}
.status-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.2)}
.status-badge.live .status-dot{background:#34D399;animation:pulse 2s infinite}

/* API Key */
.api-key-panel{padding:12px 18px;background:rgba(0,0,0,0.4);border-bottom:1px solid rgba(255,255,255,0.04)}
.api-key-label{font-size:9px;color:rgba(255,255,255,0.25);letter-spacing:0.14em;display:block;margin-bottom:8px}
.api-key-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.api-key-input{flex:1;min-width:200px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:8px;padding:8px 12px;color:#fff;font-size:12px;font-family:monospace;outline:none}
.api-key-input:focus{border-color:rgba(124,58,237,0.5)}
.api-key-toggle,.api-key-save,.api-key-clear{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:6px;padding:6px 12px;color:rgba(255,255,255,0.5);font-size:11px;cursor:pointer;transition:all 0.15s}
.api-key-save{background:rgba(124,58,237,0.2);border-color:rgba(124,58,237,0.4);color:#A78BFA}
.api-key-clear{background:rgba(248,113,113,0.1);border-color:rgba(248,113,113,0.3);color:#F87171}
.api-key-hint{font-size:10px;color:rgba(255,255,255,0.15);margin:8px 0 0}

/* Visualizer */
.visualizer-container{height:80px;background:rgba(0,0,0,0.4);border-bottom:1px solid rgba(255,255,255,0.03);position:relative;overflow:hidden}
.visualizer-overlay{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.06) 3px,rgba(0,0,0,0.06) 4px)}

/* Recording */
.recording-panel{padding:12px 16px;background:rgba(0,0,0,0.35);border-bottom:1px solid rgba(255,255,255,0.04)}
.rec-header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rec-label{font-size:9px;color:rgba(255,255,255,0.2);letter-spacing:0.14em;min-width:32px}
.rec-btn{border-radius:8px;padding:6px 16px;font-size:11px;cursor:pointer;font-weight:700;letter-spacing:0.06em;border:1px solid;transition:all 0.15s;flex-shrink:0}
.rec-btn.enable{background:rgba(248,113,113,0.15);border-color:rgba(248,113,113,0.3);color:#F87171}
.rec-btn.record{background:rgba(248,113,113,0.2);border-color:rgba(248,113,113,0.4);color:#F87171}
.rec-btn.stop{background:rgba(248,113,113,0.3);border-color:#F87171;color:#F87171}
.level-bar{flex:1;min-width:80px;height:8px;background:rgba(255,255,255,0.06);border-radius:4px;overflow:hidden}
.level-fill{height:100%;border-radius:4px;transition:width 0.06s,background 0.15s}
.level-text{font-size:9px;font-family:monospace;min-width:58px;letter-spacing:0.06em}
.recording-active{display:flex;align-items:center;gap:8px;flex-shrink:0}
.rec-dot{width:7px;height:7px;border-radius:50%;background:#F87171;animation:pulse 0.8s infinite}
.rec-time{font-size:12px;color:#F87171;font-family:monospace}
.processing-text{font-size:11px;color:rgba(255,255,255,0.35);font-style:italic}
.rec-error{font-size:10px;color:#F87171}
.tracks-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

/* Track Chip */
.track-chip{background:rgba(248,113,113,0.08);border:1px solid rgba(248,113,113,0.2);border-radius:10px;padding:8px 12px;display:flex;align-items:center;gap:10px;min-width:200px}
.track-info{flex:1}
.track-name{font-size:9px;color:#F87171;font-family:monospace;margin-bottom:2px;letter-spacing:0.06em}
.track-meta{font-size:10px;color:rgba(255,255,255,0.5)}
.track-note{margin-left:8px;color:#FBBF24}
.track-btn{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:6px;padding:4px 10px;color:rgba(255,255,255,0.6);font-size:11px;cursor:pointer;transition:all 0.15s}
.track-btn.active{background:rgba(248,113,113,0.3);border-color:#F87171;color:#F87171}
.track-btn.export:hover{background:rgba(52,211,153,0.15);border-color:rgba(52,211,153,0.3);color:#34D399}
.track-btn.delete{background:transparent;border:none;color:rgba(255,255,255,0.2);font-size:14px;padding:0 2px}
.track-btn.delete:hover{color:#F87171}

/* Step Grid */
.step-grid{padding:10px 16px 12px;background:rgba(0,0,0,0.3);border-bottom:1px solid rgba(255,255,255,0.04)}
.step-grid-header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.seq-btn{border-radius:6px;padding:4px 14px;font-size:11px;cursor:pointer;font-weight:700;letter-spacing:0.06em;border:1px solid;transition:all 0.15s}
.seq-btn.play{background:rgba(124,58,237,0.2);border-color:rgba(139,92,246,0.4);color:#A78BFA}
.seq-btn.stop{background:rgba(248,113,113,0.15);border-color:rgba(248,113,113,0.5);color:#F87171}
.bpm-control{display:flex;align-items:center;gap:8px;margin-left:auto}
.bpm-label{font-size:9px;color:rgba(255,255,255,0.25);letter-spacing:0.1em}
.bpm-slider{width:72px;accent-color:#7C3AED}
.bpm-value{font-size:12px;color:#A78BFA;font-family:monospace;min-width:30px;text-align:right}
.step-row{display:flex;align-items:center;gap:5px;margin-bottom:4px}
.step-label{font-size:8px;font-family:monospace;width:30px;letter-spacing:0.06em;opacity:0.8}
.step-cells{display:flex;gap:2px;flex:1}
.step-cell{flex:1;height:20px;border-radius:3px;cursor:pointer;transition:all 0.08s;border:1px solid}
.step-cell:hover{transform:scale(1.15)}

/* Chips */
.chips-bar,.presets-bar{padding:8px 16px;display:flex;gap:8px;flex-wrap:wrap;background:rgba(0,0,0,0.25);border-bottom:1px solid rgba(255,255,255,0.03);align-items:center}
.chips-label,.presets-label{font-size:8px;color:rgba(255,255,255,0.18);letter-spacing:0.14em;margin-right:2px}
.chip{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:8px 14px;cursor:pointer;user-select:none;transition:all 0.1s;min-width:70px;text-align:center}
.chip.active{background:rgba(124,58,237,0.3);border-color:#7C3AED;box-shadow:0 0 20px rgba(124,58,237,0.4)}
.chip-id{font-size:9px;color:#A78BFA;font-family:monospace;margin-bottom:3px;letter-spacing:0.06em}
.chip-note{font-size:14px;font-weight:700;color:#fff}
.chip-fx{font-size:8px;color:rgba(255,255,255,0.25);font-family:monospace;margin-top:2px}
.preset-btn{background:rgba(52,211,153,0.1);border:1px solid rgba(52,211,153,0.2);border-radius:6px;padding:4px 12px;color:#34D399;font-size:10px;cursor:pointer;letter-spacing:0.06em;transition:all 0.15s}
.preset-btn:hover{background:rgba(52,211,153,0.2);border-color:rgba(52,211,153,0.4)}

/* Chat */
.chat{flex:1;overflow-y:auto;padding:20px 18px;display:flex;flex-direction:column;gap:16px}
.msg{display:flex;flex-direction:column;max-width:82%}
.msg.user{align-self:flex-end;align-items:flex-end}
.msg.assistant{align-self:flex-start;align-items:flex-start}
.msg-avatar{display:flex;align-items:center;gap:6px;margin-bottom:6px;margin-left:2px}
.msg-avatar span:first-child{font-size:12px;filter:drop-shadow(0 0 4px rgba(124,58,237,0.8))}
.msg-name{font-size:9px;color:#A78BFA;letter-spacing:0.1em}
.msg-bubble{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:3px 16px 16px 16px;padding:12px 16px;font-size:14px;line-height:1.75;color:rgba(255,255,255,0.85);white-space:pre-line}
.msg.user .msg-bubble{background:rgba(124,58,237,0.15);border-color:rgba(124,58,237,0.25);border-radius:16px 3px 16px 16px;color:#DDD6FE}
.msg-loading{display:flex;align-items:center;gap:8px;padding-left:2px}
.msg-loading span{font-size:12px;filter:drop-shadow(0 0 4px rgba(124,58,237,0.8))}
.loading-dots{display:flex;gap:4px}
.loading-dots div{width:4px;height:4px;border-radius:50%;background:#A78BFA;animation:bounce 1.2s infinite}
.loading-dots div:nth-child(2){animation-delay:0.2s}
.loading-dots div:nth-child(3){animation-delay:0.4s}

/* Input */
.input-bar{padding:14px 18px;background:rgba(0,0,0,0.7);border-top:1px solid rgba(255,255,255,0.05);backdrop-filter:blur(16px)}
.input-row{display:flex;gap:10px;align-items:flex-end}
.input-textarea{flex:1;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:12px 16px;color:#fff;font-size:14px;resize:none;outline:none;font-family:inherit;line-height:1.6;transition:border-color 0.2s;min-height:50px}
.input-textarea:focus{border-color:rgba(124,58,237,0.5)}
.input-textarea::placeholder{color:rgba(255,255,255,0.15)}
.input-send{background:linear-gradient(135deg,#7C3AED,#5B21B6);border:1px solid rgba(167,139,250,0.3);border-radius:14px;width:50px;height:50px;cursor:pointer;color:#fff;font-size:18px;flex-shrink:0;box-shadow:0 0 20px rgba(124,58,237,0.3);transition:all 0.15s}
.input-send:hover{box-shadow:0 0 30px rgba(124,58,237,0.5);transform:scale(1.05)}
.input-send:disabled{background:rgba(124,58,237,0.15);border-color:rgba(124,58,237,0.2);cursor:not-allowed;box-shadow:none;transform:none}
.input-hint{font-size:10px;color:rgba(255,255,255,0.12);margin-top:8px;text-align:center;letter-spacing:0.05em}

/* Animations */
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.4;transform:scale(0.85)}}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:0.25}40%{transform:translateY(-6px);opacity:1}}
::-webkit-scrollbar{width:2px}
::-webkit-scrollbar-thumb{background:rgba(124,58,237,0.3);border-radius:2px}
</style>
</head>
<body>
<div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>
/* CONDUCTOR v2 — Pure JavaScript (No Babel/JSX required) */
/* Transpiled from React JSX to vanilla JS with React.createElement */

(function() {
"use strict";

// Global error handler for debugging
window.onerror = function(msg, url, line, col, error) {
  console.error("Global error:", msg, "at line", line);
  var root = document.getElementById("root");
  if (root) {
    root.innerHTML = '<div style="color:#fff;padding:20px;font-family:monospace;">' +
      '<h3>Something went wrong</h3>' +
      '<p>Error: ' + msg + '</p>' +
      '<p>Line: ' + line + '</p>' +
      '<p>Check console for details (menu → Tools → Web Developer → Web Console)</p>' +
      '</div>';
  }
  return false;
};

var React = window.React;
var useState = React.useState;
var useRef = React.useRef;
var useEffect = React.useEffect;
var useCallback = React.useCallback;
var useMemo = React.useMemo;
var createElement = React.createElement;

// ============================================================
// CONSTANTS
// ============================================================
var NOTE_MAP = { C: 0, "C#": 1, Db: 1, D: 2, "D#": 3, Eb: 3, E: 4, F: 5, "F#": 6, Gb: 6, G: 7, "G#": 8, Ab: 8, A: 9, "A#": 10, Bb: 10, B: 11 };
var NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
var MIN_FREQ = 27.5;
var MAX_FREQ = 4186.0;
var FFT_SIZE = 4096;
var HOP_SIZE = 2048;
var RMS_THRESHOLD = 0.001;
var SEQUENCER_STEPS = 16;
var LOOKAHEAD_S = 0.1;
var API_KEY_STORAGE_KEY = "conductor_api_key";
var SESSION_KEY = "conductor_session_v2";

// ============================================================
// AUDIO CONTEXT MANAGER
// ============================================================
function AudioContextManager() {
  this.ctx = null;
  this.state = "suspended";
  this._resumePromise = null;
  this._listeners = new Set();
}

AudioContextManager.prototype.get = function() {
  if (!this.ctx || this.ctx.state === "closed") {
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) throw new Error("Web Audio API not supported");
    this.ctx = new Ctx({ latencyHint: "interactive", sampleRate: 48000 });
    var self = this;
    this.ctx.addEventListener("statechange", function() {
      self.state = self.ctx.state;
      self._listeners.forEach(function(fn) { fn(self.ctx.state); });
    });
    this.state = this.ctx.state;
  }
  return this.ctx;
};

AudioContextManager.prototype.resume = function() {
  var c = this.get();
  if (c.state === "running") return Promise.resolve(c);
  if (this._resumePromise) return this._resumePromise;
  var self = this;
  this._resumePromise = c.resume().then(function() { return c; }).finally(function() { self._resumePromise = null; });
  return this._resumePromise;
};

AudioContextManager.prototype.onStateChange = function(fn) {
  this._listeners.add(fn);
  return function() { this._listeners.delete(fn); }.bind(this);
};

Object.defineProperty(AudioContextManager.prototype, "currentTime", {
  get: function() { return this.get().currentTime; }
});

Object.defineProperty(AudioContextManager.prototype, "sampleRate", {
  get: function() { return this.get().sampleRate; }
});

var audioManager = new AudioContextManager();

// ============================================================
// MASTER BUS
// ============================================================
var masterBus = null;

function getMasterBus() {
  if (!masterBus) {
    var ctx = audioManager.get();
    var bus = {
      input: ctx.createGain(),
      compressor: ctx.createDynamicsCompressor(),
      limiter: ctx.createDynamicsCompressor()
    };
    bus.input.gain.value = 0.85;
    bus.compressor.threshold.value = -18;
    bus.compressor.knee.value = 6;
    bus.compressor.ratio.value = 4;
    bus.compressor.attack.value = 0.003;
    bus.compressor.release.value = 0.15;
    bus.limiter.threshold.value = -3;
    bus.limiter.knee.value = 0;
    bus.limiter.ratio.value = 20;
    bus.limiter.attack.value = 0.001;
    bus.limiter.release.value = 0.05;
    bus.input.connect(bus.compressor);
    bus.compressor.connect(bus.limiter);
    bus.limiter.connect(ctx.destination);
    bus.setVolume = function(db) {
      var linear = Math.pow(10, db / 20);
      bus.input.gain.setTargetAtTime(Math.min(linear, 1.2), audioManager.currentTime, 0.02);
    };
    bus.getInputNode = function() { return bus.input; };
    masterBus = bus;
  }
  return masterBus;
}

// ============================================================
// UTILITIES
// ============================================================
function noteToFreq(note) {
  var m = note.match(/^([A-G](?:#|b)?)(-?\d+)$/);
  if (!m) { console.warn("Invalid note: " + note); return null; }
  var semitone = NOTE_MAP[m[1]];
  if (semitone === undefined) return null;
  var octave = parseInt(m[2], 10);
  var midi = semitone + (octave + 1) * 12;
  return 440 * Math.pow(2, (midi - 69) / 12);
}

function freqToNote(freq) {
  if (!freq || freq < MIN_FREQ || freq > MAX_FREQ) return null;
  var midi = Math.round(12 * Math.log2(freq / 440) + 69);
  return NOTE_NAMES[midi % 12] + (Math.floor(midi / 12) - 1);
}

function makeDistortionCurve(amount, samples) {
  samples = samples || 256;
  var curve = new Float32Array(samples);
  var k = amount * 300;
  var denom = Math.PI + k;
  for (var i = 0; i < samples; i++) {
    var x = (i * 2) / samples - 1;
    curve[i] = (denom * x) / (Math.PI + k * Math.abs(x));
  }
  return curve;
}

function createReverbBuffer(ctx, duration, decay, preDelay) {
  preDelay = preDelay || 0.01;
  var sampleRate = ctx.sampleRate;
  var length = Math.floor(sampleRate * (duration + preDelay));
  var buffer = ctx.createBuffer(2, length, sampleRate);
  for (var ch = 0; ch < 2; ch++) {
    var data = buffer.getChannelData(ch);
    for (var i = 0; i < length; i++) {
      var t = i / sampleRate;
      if (t < preDelay) { data[i] = 0; continue; }
      var rel = (t - preDelay) / duration;
      var env = Math.pow(1 - rel, 1 + decay * 2);
      data[i] = (Math.random() * 2 - 1) * env;
    }
  }
  return buffer;
}

function clampNum(v, min, max, def) {
  var n = Number(v);
  if (isNaN(n)) return def;
  return Math.max(min, Math.min(max, n));
}

// ============================================================
// EFFECTS CHAIN
// ============================================================
function EffectsChain(ctx, options) {
  this.ctx = ctx;
  this.nodes = [];
  this.input = ctx.createGain();
  this.output = ctx.createGain();
  this.wetGain = ctx.createGain();
  this.dryGain = ctx.createGain();

  this.input.connect(this.dryGain);
  this.dryGain.connect(this.output);

  var last = this.input;

  if (options.distortion > 0) {
    var dist = ctx.createWaveShaper();
    dist.curve = makeDistortionCurve(options.distortion);
    dist.oversample = "4x";
    this.input.disconnect();
    this.input.connect(dist);
    last = dist;
    this.nodes.push(dist);
  }

  last.connect(this.dryGain);

  if (options.delay > 0) {
    var delayNode = ctx.createDelay(2.0);
    var feedback = ctx.createGain();
    var delayWet = ctx.createGain();
    delayNode.delayTime.value = 0.28 * options.delay;
    feedback.gain.value = options.delay * 0.42;
    delayWet.gain.value = 0.5;
    last.connect(delayNode);
    delayNode.connect(feedback);
    feedback.connect(delayNode);
    delayNode.connect(delayWet);
    delayWet.connect(this.wetGain);
    this.nodes.push(delayNode, feedback, delayWet);
  }

  if (options.reverb > 0) {
    var convolver = ctx.createConvolver();
    var reverbWet = ctx.createGain();
    var reverbDuration = 0.4 + options.reverb * 3;
    convolver.buffer = createReverbBuffer(ctx, reverbDuration, options.reverb);
    reverbWet.gain.value = options.reverb * 0.65;
    last.connect(convolver);
    convolver.connect(reverbWet);
    reverbWet.connect(this.wetGain);
    this.nodes.push(convolver, reverbWet);
  }

  this.wetGain.connect(this.output);
  this.dryGain.gain.value = 1 - (options.reverb * 0.35 + options.delay * 0.2);
  this.wetGain.gain.value = Math.max(options.reverb * 0.5, options.delay * 0.3);
  this.output.connect(getMasterBus().getInputNode());
}

EffectsChain.prototype.dispose = function() {
  try {
    this.input.disconnect();
    this.output.disconnect();
    this.wetGain.disconnect();
    this.dryGain.disconnect();
    for (var i = 0; i < this.nodes.length; i++) {
      try { this.nodes[i].disconnect(); } catch(e) {}
    }
  } catch(e) {}
};

// ============================================================
// VOICE
// ============================================================
function Voice(ctx, params) {
  this.ctx = ctx;
  this.id = params.id || "voice_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7);
  this.params = params;
  this.active = true;
  this._disposed = false;

  var now = ctx.currentTime;
  var freq = params.freq;
  var type = params.type || "sine";
  var attack = params.attack || 0.05;
  var release = params.release || 1.2;
  var vol = params.vol || 0.35;
  var reverb = params.reverb || 0;
  var delay = params.delay || 0;
  var distortion = params.distortion || 0;

  this.osc = ctx.createOscillator();
  this.osc.type = type;
  this.osc.frequency.value = freq;

  this.env = ctx.createGain();
  this.env.gain.setValueAtTime(0, now);
  this.env.gain.linearRampToValueAtTime(vol, now + attack);
  this.env.gain.setValueAtTime(vol, now + attack + 0.2);

  this.osc.connect(this.env);
  this.effects = new EffectsChain(ctx, { reverb: reverb, delay: delay, distortion: distortion });
  this.env.connect(this.effects.input);

  this.osc.start(now);
  this.stopTime = now + attack + 0.2 + release + 0.1;
  this.osc.stop(this.stopTime);

  var self = this;
  this.osc.onended = function() { self.dispose(); };
}

Voice.prototype.release = function() {
  if (!this.active) return;
  this.active = false;
  var now = this.ctx.currentTime;
  var release = this.params.release || 0.6;
  this.env.gain.cancelScheduledValues(now);
  this.env.gain.setValueAtTime(this.env.gain.value, now);
  this.env.gain.exponentialRampToValueAtTime(0.0001, now + release);
  this.osc.stop(now + release + 0.05);
};

Voice.prototype.dispose = function() {
  if (this._disposed) return;
  this._disposed = true;
  this.active = false;
  try {
    this.effects.dispose();
    try { this.osc.disconnect(); } catch(e) {}
    try { this.env.disconnect(); } catch(e) {}
  } catch(e) {}
};

// DRUM SYNTHESIZER
// ============================================================
function DrumSynthesizer(ctx) {
  this.ctx = ctx;
}

DrumSynthesizer.prototype.kick = function(time, vol) {
  vol = vol || 0.85;
  var ctx = this.ctx;
  var o = ctx.createOscillator();
  var g = ctx.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(160, time);
  o.frequency.exponentialRampToValueAtTime(40, time + 0.09);
  g.gain.setValueAtTime(vol, time);
  g.gain.exponentialRampToValueAtTime(0.001, time + 0.28);
  o.connect(g);
  g.connect(getMasterBus().getInputNode());
  o.start(time);
  o.stop(time + 0.32);
};

DrumSynthesizer.prototype.snare = function(time, vol) {
  vol = vol || 0.55;
  var ctx = this.ctx;
  var len = Math.floor(ctx.sampleRate * 0.18);
  var buf = ctx.createBuffer(1, len, ctx.sampleRate);
  var d = buf.getChannelData(0);
  for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  var n = ctx.createBufferSource();
  var f = ctx.createBiquadFilter();
  var g = ctx.createGain();
  n.buffer = buf;
  f.type = "bandpass";
  f.frequency.value = 1900;
  g.gain.setValueAtTime(vol, time);
  g.gain.exponentialRampToValueAtTime(0.001, time + 0.18);
  n.connect(f);
  f.connect(g);
  g.connect(getMasterBus().getInputNode());
  n.start(time);
  n.stop(time + 0.22);

  var o = ctx.createOscillator();
  var g2 = ctx.createGain();
  o.type = "triangle";
  o.frequency.value = 195;
  g2.gain.setValueAtTime(vol * 0.5, time);
  g2.gain.exponentialRampToValueAtTime(0.001, time + 0.1);
  o.connect(g2);
  g2.connect(getMasterBus().getInputNode());
  o.start(time);
  o.stop(time + 0.12);
};

DrumSynthesizer.prototype.hihat = function(time, open, vol) {
  vol = vol || 0.14;
  var ctx = this.ctx;
  var dur = open ? 0.28 : 0.045;
  var len = Math.floor(ctx.sampleRate * dur);
  var buf = ctx.createBuffer(1, len, ctx.sampleRate);
  var d = buf.getChannelData(0);
  for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  var n = ctx.createBufferSource();
  var f = ctx.createBiquadFilter();
  var g = ctx.createGain();
  n.buffer = buf;
  f.type = "highpass";
  f.frequency.value = 8000;
  g.gain.setValueAtTime(open ? vol * 1.3 : vol, time);
  g.gain.exponentialRampToValueAtTime(0.001, time + dur);
  n.connect(f);
  f.connect(g);
  g.connect(getMasterBus().getInputNode());
  n.start(time);
  n.stop(time + dur + 0.02);
};

// ============================================================
// PITCH DETECTION
// ============================================================
function detectPitch(buffer, sampleRate) {
  var SIZE = Math.min(FFT_SIZE, buffer.length);
  var start = Math.max(0, Math.floor(buffer.length / 2) - SIZE / 2);
  var buf = Array.prototype.slice.call(buffer, start, start + SIZE);

  var rms = 0;
  for (var i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
  rms = Math.sqrt(rms / SIZE);
  if (rms < RMS_THRESHOLD) return { freq: null, rms: rms, confidence: 0 };

  var MAX = Math.floor(SIZE / 2);
  var bestOffset = -1, bestCorr = 0;
  var corr = new Float32Array(MAX);

  for (var offset = 1; offset < MAX; offset++) {
    var c = 0;
    for (var j = 0; j < MAX; j++) c += buf[j] * buf[j + offset];
    c /= MAX;
    corr[offset] = c;
    if (c > bestCorr) { bestCorr = c; bestOffset = offset; }
  }

  if (bestOffset < 2 || bestOffset >= MAX - 1) {
    return { freq: null, rms: rms, confidence: bestCorr };
  }

  var alpha = corr[bestOffset - 1];
  var beta = corr[bestOffset];
  var gamma = corr[bestOffset + 1];
  var p = 0.5 * (alpha - gamma) / (alpha - 2 * beta + gamma);
  var refinedOffset = bestOffset + p;
  var freq = sampleRate / refinedOffset;

  if (freq < MIN_FREQ || freq > MAX_FREQ) {
    return { freq: null, rms: rms, confidence: bestCorr };
  }

  return { freq: freq, rms: rms, confidence: bestCorr };
}

function analyzePitch(audioBuffer) {
  var sr = audioBuffer.sampleRate;
  var data = audioBuffer.getChannelData(0);
  var results = [];

  for (var i = 0; i + FFT_SIZE < data.length; i += HOP_SIZE) {
    var window = Array.prototype.slice.call(data, i, i + FFT_SIZE);
    var r = detectPitch(window, sr);
    if (r.freq && r.rms > RMS_THRESHOLD) results.push(r);
  }

  if (!results.length) return { freq: null, note: null, rms: 0, confidence: 0 };

  results.sort(function(a, b) { return b.confidence - a.confidence; });
  var best = results[0];
  return { freq: best.freq, note: freqToNote(best.freq), rms: best.rms, confidence: best.confidence };
}

// ============================================================
// BEAT SEQUENCER
// ============================================================
function BeatSequencer() {
  this.bpm = 90;
  this.playing = false;
  this.step = 0;
  this.nextTime = 0;
  this._rafId = null;
  this.onStep = null;
  this.pattern = { kick: Array(SEQUENCER_STEPS).fill(0), snare: Array(SEQUENCER_STEPS).fill(0), hihat: Array(SEQUENCER_STEPS).fill(0) };
  this._drums = null;
}

BeatSequencer.prototype._ensureDrums = function() {
  if (!this._drums) this._drums = new DrumSynthesizer(audioManager.get());
  return this._drums;
};

BeatSequencer.prototype._schedule = function() {
  if (!this.playing) return;
  var ctx = audioManager.get();
  var sps = (60 / this.bpm) / 4;

  while (this.nextTime < ctx.currentTime + LOOKAHEAD_S) {
    var s = this.step;
    var t = this.nextTime;
    var drums = this._ensureDrums();

    if (this.pattern.kick[s]) drums.kick(t);
    if (this.pattern.snare[s]) drums.snare(t);
    if (this.pattern.hihat[s]) drums.hihat(t, s % 8 === 0);

    if (this.onStep) {
      (function(step) {
        var delayMs = Math.max(0, (t - ctx.currentTime) * 1000);
        setTimeout(function() { if (this.playing) this.onStep(step); }.bind(this), delayMs);
      }).call(this, s);
    }

    this.step = (s + 1) % SEQUENCER_STEPS;
    this.nextTime += sps;
  }

  this._rafId = requestAnimationFrame(this._schedule.bind(this));
};

BeatSequencer.prototype.start = function() {
  if (this.playing) return Promise.resolve();
  var self = this;
  return audioManager.resume().then(function(ctx) {
    self.playing = true;
    self.step = 0;
    self.nextTime = ctx.currentTime + 0.05;
    self._schedule();
  });
};

BeatSequencer.prototype.stop = function() {
  this.playing = false;
  if (this._rafId) {
    cancelAnimationFrame(this._rafId);
    this._rafId = null;
  }
};

BeatSequencer.prototype.setPattern = function(p) {
  this.pattern = {
    kick: (p.kick || []).slice(0, SEQUENCER_STEPS),
    snare: (p.snare || []).slice(0, SEQUENCER_STEPS),
    hihat: (p.hihat || []).slice(0, SEQUENCER_STEPS)
  };
  while (this.pattern.kick.length < SEQUENCER_STEPS) this.pattern.kick.push(0);
  while (this.pattern.snare.length < SEQUENCER_STEPS) this.pattern.snare.push(0);
  while (this.pattern.hihat.length < SEQUENCER_STEPS) this.pattern.hihat.push(0);
};

BeatSequencer.prototype.setBPM = function(b) {
  this.bpm = Math.max(60, Math.min(180, b));
};

var sequencer = new BeatSequencer();

function validateSound(s) {
  if (!s || typeof s !== "object") return null;
  var out = {};
  if (typeof s.name === "string") out.name = s.name;
  if (typeof s.note === "string") out.note = s.note;
  if (["sine", "triangle", "sawtooth", "square"].indexOf(s.type) !== -1) out.type = s.type;
  else out.type = "sine";
  out.attack = clampNum(s.attack, 0.01, 2.0, 0.05);
  out.release = clampNum(s.release, 0.2, 6.0, 1.2);
  out.reverb = clampNum(s.reverb, 0, 1, 0);
  out.delay = clampNum(s.delay, 0, 1, 0);
  out.distortion = clampNum(s.distortion, 0, 1, 0);
  out.volume = clampNum(s.volume, -20, -4, -8);
  return out;
}

function validateStepArray(arr) {
  if (!Array.isArray(arr)) return Array(SEQUENCER_STEPS).fill(0);
  return arr.slice(0, SEQUENCER_STEPS).map(function(v) { return v ? 1 : 0; });
}

function validateBeat(b) {
  if (!b || typeof b !== "object") return null;
  return {
    bpm: clampNum(b.bpm, 60, 180, 90),
    kick: validateStepArray(b.kick),
    snare: validateStepArray(b.snare),
    hihat: validateStepArray(b.hihat)
  };
}

function Visualizer(props) {
  var canvasRef = useRef(null);
  var rafRef = useRef(null);
  var timeRef = useRef(0);

  useEffect(function() {
    var canvas = canvasRef.current;
    if (!canvas) return;
    var ctx = canvas.getContext("2d");

    function resize() {
      var dpr = window.devicePixelRatio || 1;
      var rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
    }
    resize();
    window.addEventListener("resize", resize);

    function draw() {
      rafRef.current = requestAnimationFrame(draw);
      timeRef.current += 0.018;
      var t = timeRef.current;
      var dpr = window.devicePixelRatio || 1;
      var W = canvas.width / dpr;
      var H = canvas.height / dpr;

      ctx.clearRect(0, 0, W, H);
      ctx.strokeStyle = "rgba(255,255,255,0.03)";
      ctx.lineWidth = 1;
      [H * 0.25, H * 0.5, H * 0.75].forEach(function(y) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
      });

      var hasNotes = props.activeNotes > 0;
      var amp = props.recording ? 35 : props.playing ? 28 : hasNotes ? 20 : 3;
      var spd = props.recording ? 2.2 : props.playing ? 1.8 : 1;
      var color = props.recording ? "#F87171" : "#A78BFA";
      var r = props.recording ? "248,113,113" : "124,58,237";

      ctx.lineWidth = 1.5;
      ctx.shadowBlur = props.recording ? 28 : props.playing ? 20 : 5;
      ctx.shadowColor = color;

      var grad = ctx.createLinearGradient(0, 0, W, 0);
      grad.addColorStop(0, "rgba(" + r + ",0.05)");
      grad.addColorStop(0.5, color);
      grad.addColorStop(1, "rgba(" + r + ",0.05)");
      ctx.strokeStyle = grad;

      ctx.beginPath();
      for (var x = 0; x < W; x++) {
        var y = H / 2 + Math.sin(x * 0.016 + t * spd) * amp + Math.sin(x * 0.041 + t * spd * 1.4) * (amp * 0.35) + Math.sin(x * 0.008 + t * spd * 0.6) * (amp * 0.2);
        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    draw();
    return function() {
      cancelAnimationFrame(rafRef.current);
      window.removeEventListener("resize", resize);
    };
  }, [props.playing, props.recording, props.activeNotes]);

  return createElement("canvas", {
    ref: canvasRef,
    style: { width: "100%", height: "100%", display: "block" }
  });
}

function Chip(props) {

        reverb: props.s.reverb,

      });

  }, [props.id, props.s]);

  var lift = useCallback(function() {

    releaseNote(props.id);
  }, [props.id]);

  useEffect(function() {
    return function() {
      if (on) lift();

  var fx = [];
  if (props.s.reverb > 0) fx.push("rv");

  return createElement("div", {

    onTouchEnd: function(e) { e.preventDefault(); lift(); }

    var ctx = audioManager.get();
    if (sourceRef.current) {
      try { sourceRef.current.disconnect(); } catch(e) {}

      try { analyserRef.current.disconnect(); } catch(e) {}

    sourceRef.current = source;
    analyserRef.current = analyser;
    var data = new Uint8Array(analyser.frequencyBinCount);

    function tick() {
      analyser.getByteFrequencyData(data);
      var avg = data.reduce(function(a, b) { return a + b; }, 0) / data.length;
      var pct = Math.min(100, (avg / 128) * 100);
      setMicLevel(pct);
      if (pct < 3) { setLevelLabel("NO SIGNAL"); setLevelColor("rgba(255,255,255,0.08)"); }
      else if (pct < 15) { setLevelLabel("LOW"); setLevelColor("#FBBF24"); }
      else if (pct < 65) { setLevelLabel("GOOD"); setLevelColor("#34D399"); }
      else { setLevelLabel("HOT"); setLevelColor("#F87171"); }
      levelRafRef.current = requestAnimationFrame(tick);
    }
    tick();

    if (sourceRef.current) {
      try { sourceRef.current.disconnect(); } catch(e) {}
      sourceRef.current = null;
    }
    if (analyserRef.current) {

  var processRecording = useCallback(function() {

      });
    }).then(function(audioBuffer) {

      var track = {
        name: trackName,

        rms: result.rms,
        confidence: result.confidence,
        blob: blob
      };
      setTracks(function(prev) { return prev.concat([track]); });
      var analysis = {
        trackName: trackName,
        duration: duration.toFixed(1),
        dominantNote: result.note || "unclear",
        detectedFrequency: result.freq ? Math.round(result.freq) + "Hz" : "unclear",
        signalStrength: result.rms > 0.05 ? "strong" : result.rms > 0.005 ? "moderate" : "very quiet",
        confidence: result.confidence ? (result.confidence * 100).toFixed(1) + "%" : "low",
        sampleRate: audioBuffer.sampleRate
      };
      props.onAnalysisReady(analysis);
      setRecState("ready");
    }).catch(function(e) {
      console.error("Recording processing error:", e);
      setError("Could not process recording: " + e.message);
      setRecState("ready");

      (recState === "ready" || recState === "recording") ? [

        ),

      ] : null,

      recState === "recording" ? createElement("div", { className: "recording-active" },

    // Visualizer
    createElement("div", { className: "visualizer-container" },
      createElement(Visualizer, { playing: playing, recording: showRec, activeNotes: noteTracker.activeCount }),
      createElement("div", { className: "visualizer-overlay" })
    ),

    // Recording Panel
    showRec ? createElement(RecordingPanel, { onAnalysisReady: handleAnalysis }) : null,

    // Beat Grid
    showBeat ? createElement(StepGrid, {
      pattern: pattern,
      activeStep: activeStep,
      onToggle: toggleStep,
      bpm: bpm,
      onBPM: handleBPM,
      playing: playing,
      onPlay: startBeat,
      onStop: stopBeat
    }) : null,

    // Offline Presets
    !apiKey ? createElement("div", { className: "presets-bar" },
      createElement("span", { className: "presets-label" }, "OFFLINE PRESETS"),
      Object.keys(OFFLINE_PRESETS).map(function(name) {
        return createElement("button", {
          key: name,
          onClick: function() { applyPreset(name); },
          className: "preset-btn"
        }, name.toUpperCase());
      })
    ) : null,

    // Sound Chips
    Object.keys(sounds).length > 0 ? createElement("div", { className: "chips-bar" },
      createElement("span", { className: "chips-label" }, "HOLD TO PLAY"),
      Object.keys(sounds).map(function(id) {
        return createElement(Chip, { key: id, id: id, s: sounds[id] });
      })
    ) : null,

    // Chat
    createElement("div", { ref: chatRef, className: "chat" },
      messages.map(function(m, i) {
        return createElement("div", { key: i, className: "msg " + m.role },
          m.role === "assistant" ? createElement("div", { className: "msg-avatar" },
            createElement("span", null, "◈"),
            createElement("span", { className: "msg-name" }, "CO-CO")
          ) : null,
          createElement("div", { className: "msg-bubble" }, m.text)
        );
      }),
      loading ? createElement("div", { className: "msg-loading" },
        createElement("span", null, "◈"),
        createElement("div", { className: "loading-dots" },
          createElement("div", null),
          createElement("div", null),
          createElement("div", null)
        )
      ) : null
    ),

    // Input
    createElement("div", { className: "input-bar" },
      createElement("div", { className: "input-row" },
        createElement("textarea", {
          ref: inputRef,
          value: input,
          onChange: function(e) { setInput(e.target.value); },
          onKeyDown: function(e) { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } },
          placeholder: "Tell Co-Co what's in your head...",
          rows: 2,
          className: "input-textarea"
        }),
        createElement("button", {
          onClick: send,
          disabled: loading || !input.trim(),
          className: "input-send"
        }, loading ? "⟳" : "▶")
      ),
      createElement("p", { className: "input-hint" }, "🎙 REC to record · BEAT for sequencer · Enter to send · Try ambient, driving, or chill in offline mode")
    )
  );
}

// ============================================================
// RENDER
// ============================================================
try {
  var container = document.getElementById("root");
  if (!container) {
    console.error("Root element not found");
    document.body.innerHTML = '<div style="color:#fff;padding:20px;">Error: #root not found</div>';
  } else if (ReactDOM.createRoot) {
    var root = ReactDOM.createRoot(container);
    root.render(createElement(App));
  } else if (ReactDOM.render) {
    ReactDOM.render(createElement(App), container);
  } else {
    console.error("No ReactDOM render method available");
    container.innerHTML = '<div style="color:#fff;padding:20px;">Error: ReactDOM not loaded. Check internet connection.</div>';
  }
} catch (e) {
  console.error("Render error:", e);
  document.body.innerHTML = '<div style="color:#fff;padding:20px;">Error: ' + e.message + '</div>';
}
})();

</script>
</body>
</html>
